<!doctype html>
<html lang="%lang%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light" />
		<meta name="theme-color" content="#EDEDEA" />
		<link
			rel="preload"
			href="/fonts/BricolageGrotesque-latin.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<!--
			Preenchido pelo hook, por rota. Precisa vir antes do bloco do SvelteKit:
			lá dentro saem ~16 link rel=modulepreload, e um preload de imagem depois
			deles entra na fila atrás de todo o JS de hidratação.
			(Não cite o placeholder do head aqui: o SvelteKit substitui a primeira
			ocorrência que encontrar, comentário incluído.)
		-->
		%head.preload% %sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
